<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070b14"/>
      <stop offset="0.55" stop-color="#0b1324"/>
      <stop offset="1" stop-color="#05070d"/>
    </linearGradient>
    <linearGradient id="rock" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#293246"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="soft"><feGaussianBlur stdDeviation="2"/></filter>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>

  <g opacity="0.22">
    <circle cx="1280" cy="120" r="2" fill="#9fb3c8"/>
    <circle cx="1380" cy="180" r="1.5" fill="#9fb3c8"/>
    <circle cx="1180" cy="210" r="1.5" fill="#9fb3c8"/>
    <circle cx="220" cy="140" r="1.5" fill="#9fb3c8"/>
    <circle cx="340" cy="220" r="2" fill="#9fb3c8"/>
    <path d="M0 730 L290 520 L470 690 L660 430 L860 690 L1080 500 L1320 690 L1600 450 L1600 900 L0 900 Z" fill="#0b1020"/>
  </g>

  <text x="90" y="112" fill="#f3f6fb" font-family="Inter,Arial,sans-serif" font-size="54" font-weight="700">BEDROCK AUXILIARY REQUESTS</text>
  <text x="92" y="158" fill="#8ea0b8" font-family="Inter,Arial,sans-serif" font-size="24">Issue #124923 · remove the guaranteed 400, restore context probing</text>

  <!-- left: failure path -->
  <g transform="translate(90,230)">
    <rect width="610" height="470" rx="30" fill="#0b111d" stroke="#26334a" stroke-width="2"/>
    <text x="34" y="52" fill="#ff6677" font-family="Inter,Arial,sans-serif" font-size="22" font-weight="700">BEFORE</text>

    <rect x="38" y="92" width="222" height="86" rx="18" fill="#111a2a" stroke="#35445f"/>
    <text x="58" y="126" fill="#d7e0ec" font-family="ui-monospace,monospace" font-size="18">title_generation</text>
    <text x="58" y="153" fill="#7f91ab" font-family="ui-monospace,monospace" font-size="16">response_format</text>

    <path d="M270 135 H350" stroke="#ff5165" stroke-width="5" marker-end="url(#none)"/>
    <polygon points="350,135 332,124 332,146" fill="#ff5165"/>

    <g transform="translate(370,72)">
      <path d="M18 112 L86 18 L158 112 Z" fill="url(#rock)" stroke="#4d5e79" stroke-width="2"/>
      <path d="M85 18 L105 46 L91 43 L78 58 L68 44 Z" fill="#d9e3ef" opacity=".7"/>
      <text x="20" y="146" fill="#a7b4c7" font-family="Inter,Arial,sans-serif" font-size="18">AnthropicBedrock</text>
    </g>

    <rect x="42" y="235" width="525" height="72" rx="14" fill="#180d13" stroke="#6b2634"/>
    <text x="62" y="265" fill="#ff7487" font-family="ui-monospace,monospace" font-size="17">output_config.format</text>
    <text x="62" y="291" fill="#ff9baa" font-family="ui-monospace,monospace" font-size="15">400 · Extra inputs are not permitted</text>

    <rect x="42" y="336" width="525" height="88" rx="14" fill="#101725" stroke="#33435d"/>
    <text x="62" y="367" fill="#d6deea" font-family="ui-monospace,monospace" font-size="17">context probe · maxTokens=8</text>
    <text x="62" y="394" fill="#ff9baa" font-family="ui-monospace,monospace" font-size="15">OpenAI-on-Bedrock rejects &lt; 16 first</text>
    <text x="62" y="418" fill="#8294ad" font-family="ui-monospace,monospace" font-size="14">→ 128K fallback → early compression</text>
  </g>

  <!-- center separator -->
  <g transform="translate(760,438)">
    <circle r="58" fill="#101828" stroke="#34455f" stroke-width="2"/>
    <path d="M-20 0 H20" stroke="#dfe8f5" stroke-width="5"/>
    <path d="M8 -13 L22 0 L8 13" fill="none" stroke="#dfe8f5" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- right: fixed path -->
  <g transform="translate(860,230)">
    <rect width="650" height="470" rx="30" fill="#0b111d" stroke="#26334a" stroke-width="2"/>
    <text x="34" y="52" fill="#69e6b2" font-family="Inter,Arial,sans-serif" font-size="22" font-weight="700">AFTER</text>

    <rect x="38" y="92" width="260" height="92" rx="18" fill="#101a26" stroke="#35536b"/>
    <text x="58" y="124" fill="#d7e0ec" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="700">Explicit route marker</text>
    <text x="58" y="151" fill="#6ce1b0" font-family="ui-monospace,monospace" font-size="17">is_bedrock=True</text>

    <path d="M315 138 H385" stroke="#69e6b2" stroke-width="5"/>
    <polygon points="385,138 367,127 367,149" fill="#69e6b2"/>

    <g transform="translate(405,74)">
      <path d="M18 112 L86 18 L158 112 Z" fill="url(#rock)" stroke="#4d5e79" stroke-width="2"/>
      <path d="M85 18 L105 46 L91 43 L78 58 L68 44 Z" fill="#d9e3ef" opacity=".7"/>
      <text x="18" y="146" fill="#a7b4c7" font-family="Inter,Arial,sans-serif" font-size="18">Bedrock only</text>
    </g>

    <rect x="42" y="235" width="560" height="72" rx="14" fill="#0d1a17" stroke="#24604a"/>
    <text x="62" y="265" fill="#77e5b5" font-family="ui-monospace,monospace" font-size="17">skip output_config.format</text>
    <text x="62" y="291" fill="#9fe9c7" font-family="ui-monospace,monospace" font-size="15">native Anthropic keeps structured output</text>

    <rect x="42" y="336" width="560" height="88" rx="14" fill="#0f1823" stroke="#31536c"/>
    <text x="62" y="367" fill="#d6deea" font-family="ui-monospace,monospace" font-size="17">context probe · maxTokens=16</text>
    <text x="62" y="394" fill="#79d8ff" font-family="ui-monospace,monospace" font-size="15">length validation becomes reachable</text>
    <text x="62" y="418" fill="#8294ad" font-family="ui-monospace,monospace" font-size="14">→ parse real maximum → correct compression window</text>
  </g>

  <g transform="translate(90,755)">
    <rect width="1420" height="78" rx="20" fill="#0a101b" stroke="#223149"/>
    <circle cx="36" cy="39" r="9" fill="#69e6b2" filter="url(#glow)"/>
    <text x="62" y="34" fill="#e5ebf4" font-family="Inter,Arial,sans-serif" font-size="20" font-weight="700">Narrow fix, preserved capabilities</text>
    <text x="62" y="59" fill="#8da0b9" font-family="Inter,Arial,sans-serif" font-size="16">Bedrock Claude avoids the invalid field · Anthropic/Nous/Mantle behavior stays intact · probe meets the provider minimum</text>
  </g>

  <text x="1460" y="870" text-anchor="end" fill="#43526a" font-family="ui-monospace,monospace" font-size="14">JoaoMarcos44 · hermes-agent #124923</text>
</svg>