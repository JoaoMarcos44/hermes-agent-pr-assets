<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#06111d"/><stop offset="0.55" stop-color="#0a1b2c"/><stop offset="1" stop-color="#10273a"/></linearGradient>
  <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#123f55" stop-opacity=".55"/><stop offset="1" stop-color="#06111d" stop-opacity=".1"/></linearGradient>
  <linearGradient id="signal" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#76e8ff"/><stop offset="1" stop-color="#c6ffb4"/></linearGradient>
  <filter id="glow"><feGaussianBlur stdDeviation="8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <filter id="soft"><feDropShadow dx="0" dy="10" stdDeviation="18" flood-color="#000" flood-opacity=".35"/></filter>
  <style>
    .sans{font-family:Inter,Segoe UI,Arial,sans-serif}.mono{font-family:ui-monospace,SFMono-Regular,Consolas,monospace}
    .title{font-size:46px;font-weight:800;fill:#f4fbff}.sub{font-size:21px;fill:#b8cbd7}.k{font-size:17px;font-weight:800;letter-spacing:2px;fill:#83e8ff}
    .h{font-size:25px;font-weight:800;fill:#f5fbff}.b{font-size:18px;fill:#d7e5ec}.small{font-size:15px;fill:#a9c0cd}.code{font-size:17px;fill:#dff9ff}
    .chip{font-size:15px;font-weight:700;fill:#06111d}.num{font-size:18px;font-weight:900;fill:#06111d}
  </style>
</defs>
<rect width="1600" height="900" fill="url(#bg)"/>
<path d="M0 610 C260 530 500 700 770 605 S1250 520 1600 650 L1600 900 L0 900Z" fill="url(#sea)"/>
<g opacity=".18" fill="none" stroke="#79e9ff"><circle cx="1420" cy="105" r="44"/><circle cx="1492" cy="178" r="17"/><circle cx="1320" cy="215" r="12"/><circle cx="1540" cy="305" r="28"/></g>
<text x="78" y="78" class="sans k">HERMES AGENT · ISSUE #124893 · ROOT-CAUSE FIX</text>
<text x="78" y="135" class="sans title">Gateway identity survives the runtime shim</text>
<text x="78" y="174" class="sans sub">Windows update no longer mistakes Hermes’ own <tspan class="mono">python -I -c</tspan> launcher for an unrelated wrapper.</text>
<line x1="115" y1="240" x2="1080" y2="240" stroke="url(#signal)" stroke-width="4" opacity=".8"/>
<g class="sans">
  <circle cx="130" cy="240" r="20" fill="#ff8d91"/><text x="124" y="247" class="num">1</text>
  <circle cx="450" cy="240" r="20" fill="#ffd38a"/><text x="444" y="247" class="num">2</text>
  <circle cx="770" cy="240" r="20" fill="#80e8ff"/><text x="764" y="247" class="num">3</text>
  <circle cx="1065" cy="240" r="20" fill="#baf7ac"/><text x="1059" y="247" class="num">4</text>
</g>
<g filter="url(#soft)">
<rect x="78" y="278" width="290" height="270" rx="24" fill="#111f2e" stroke="#ff8d91" stroke-opacity=".65"/>
<rect x="395" y="278" width="290" height="270" rx="24" fill="#111f2e" stroke="#ffd38a" stroke-opacity=".65"/>
<rect x="712" y="278" width="290" height="270" rx="24" fill="#111f2e" stroke="#80e8ff" stroke-opacity=".65"/>
<rect x="1029" y="278" width="290" height="270" rx="24" fill="#111f2e" stroke="#baf7ac" stroke-opacity=".65"/>
</g>
<text x="104" y="318" class="sans h">Problem</text>
<text x="104" y="355" class="sans b"><tspan x="104" dy="0">A live gateway is launched as</tspan><tspan x="104" dy="30" class="mono">python -I -c &lt;bootstrap&gt;</tspan><tspan x="104" dy="30" class="mono">gateway run --replace</tspan><tspan x="104" dy="42">Strict identity rejects it.</tspan><tspan x="104" dy="30">Update aborts before fetch.</tspan></text>
<text x="421" y="318" class="sans h">Root cause</text>
<text x="421" y="355" class="sans b"><tspan x="421" dy="0">argv boundaries were flattened,</tspan><tspan x="421" dy="30">so the large <tspan class="mono">-c</tspan> source split</tspan><tspan x="421" dy="30">into unrelated words.</tspan><tspan x="421" dy="42">Then the #107002 guard</tspan><tspan x="421" dy="30">rejected every inline source.</tspan></text>
<text x="738" y="318" class="sans h">Fix at the owner</text>
<text x="738" y="355" class="sans b"><tspan x="738" dy="0">Preserve argv boundaries at read:</tspan><tspan x="738" dy="30" class="mono">/proc + psutil -&gt; quoted argv</tspan><tspan x="738" dy="42">AST-verify the exact bootstrap</tspan><tspan x="738" dy="30">emitted by <tspan class="mono">runtime_command()</tspan>,</tspan><tspan x="738" dy="30">then reuse canonical subcommand logic.</tspan></text>
<text x="1055" y="318" class="sans h">Invariant</text>
<text x="1055" y="355" class="sans b"><tspan x="1055" dy="0">Hermes’ in-process launcher:</tspan><tspan x="1055" dy="30" fill="#baf7ac">recognized ✓</tspan><tspan x="1055" dy="42">Arbitrary <tspan class="mono">python -c</tspan> wrapper:</tspan><tspan x="1055" dy="30" fill="#ff9b9f">still rejected ✓</tspan><tspan x="1055" dy="42">No substring identity guessing.</tspan></text>
<rect x="78" y="584" width="980" height="126" rx="22" fill="#07131f" stroke="#37647a"/>
<text x="104" y="618" class="sans k">BEFORE → AFTER</text>
<text x="104" y="654" class="mono code">flatten argv boundaries -&gt; preserve argv items -&gt; verify launcher AST -&gt; gateway:run</text>
<text x="104" y="687" class="sans small">One identity contract now covers Windows psutil and Linux /proc while keeping the detached restart watcher non-identity.</text>
<g class="sans">
<rect x="78" y="750" width="210" height="44" rx="22" fill="#8cecff"/><text x="112" y="778" class="chip">UPDATE CONTINUES</text>
<rect x="305" y="750" width="210" height="44" rx="22" fill="#baf7ac"/><text x="342" y="778" class="chip">STATUS SEES PID</text>
<rect x="532" y="750" width="210" height="44" rx="22" fill="#ffd38a"/><text x="585" y="778" class="chip">STOP WORKS</text>
<rect x="759" y="750" width="299" height="44" rx="22" fill="#d7c8ff"/><text x="803" y="778" class="chip">#107002 GUARD PRESERVED</text>
</g>
<text x="78" y="842" class="sans small">Original contribution · no cherry-pick · focused on gateway/status.py + regression tests</text>
<g transform="translate(1110 545)">
  <ellipse cx="245" cy="255" rx="220" ry="105" fill="#0b2b3b" stroke="#4bb6cf" stroke-opacity=".6" stroke-width="3"/>
  <path d="M65 255 Q80 70 245 55 Q410 70 425 255" fill="#103a4e" fill-opacity=".55" stroke="#71dcf5" stroke-width="4"/>
  <path d="M95 236 Q112 98 245 88 Q378 98 395 236" fill="#0b1a2c" stroke="#66b8d0" stroke-width="2"/>
  <circle cx="245" cy="174" r="52" fill="#183649"/>
  <circle cx="245" cy="164" r="27" fill="#ffd8bd"/>
  <path d="M219 151 Q245 124 272 151" fill="#24354b"/><path d="M225 176 Q245 190 266 176" fill="none" stroke="#b56c75" stroke-width="2"/>
  <path d="M206 218 Q245 196 285 218 L300 275 L190 275Z" fill="#1f5670"/>
  <circle cx="265" cy="156" r="4" fill="#102030"/><circle cx="235" cy="156" r="4" fill="#102030"/>
  <g transform="rotate(-20 165 202)"><rect x="104" y="179" width="125" height="28" rx="10" fill="#d8e7ef"/><rect x="95" y="183" width="25" height="20" rx="6" fill="#78e7ff"/><circle cx="228" cy="193" r="18" fill="#24364a"/><line x1="175" y1="208" x2="152" y2="276" stroke="#93aabc" stroke-width="8"/><line x1="175" y1="208" x2="210" y2="276" stroke="#93aabc" stroke-width="8"/></g>
  <path d="M96 185 L-25 105" stroke="url(#signal)" stroke-width="8" opacity=".7" filter="url(#glow)"/>
  <circle cx="-35" cy="98" r="9" fill="#8cecff" filter="url(#glow)"/>
  <g fill="#8cecff" opacity=".75"><circle cx="382" cy="88" r="7"/><circle cx="430" cy="138" r="4"/><circle cx="72" cy="92" r="5"/><circle cx="25" cy="164" r="3"/></g>
  <g fill="none" stroke="#baf7ac" opacity=".55"><path d="M392 130 q35 22 0 44 q-35-22 0-44Z"/><path d="M55 132 q28 18 0 36 q-28-18 0-36Z"/></g>
  <text x="116" y="324" class="sans small" fill="#a9dbe8">IDENTITY SIGNAL · VERIFIED</text>
</g>
</svg>