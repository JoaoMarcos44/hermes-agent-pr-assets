  <ellipse cx="0" cy="28" rx="30" ry="42" fill="#dc6a3d" stroke="#f0c06c" stroke-width="3"/>
  <path d="M-22 10 H22 M-27 27 H27 M-20 45 H20" stroke="#6a2a28" stroke-width="2"/>
</g>

<!-- title -->
<g filter="url(#shadow)">
  <rect x="42" y="38" width="850" height="246" rx="28" fill="#08111d" fill-opacity=".88" stroke="#bd3435" stroke-width="3"/>
  <rect x="75" y="72" width="13" height="150" fill="#b92e33"/>
  <text x="115" y="113" font-family="Georgia,serif" font-size="58" font-weight="700" fill="#f4e5bf">NODE 26 · LIBATOMIC</text>
  <text x="115" y="178" font-family="Georgia,serif" font-size="54" font-weight="700" fill="#f4e5bf">INSTALL BOUNDARY</text>
  <text x="117" y="226" font-family="Arial,sans-serif" font-size="24" fill="#d8e0e8">Issue #124926 · AlmaLinux / RHEL-family update recovery</text>
  <text x="117" y="260" font-family="Arial,sans-serif" font-size="23" fill="#74ddb1">Repair only while staging. Keep verify() read-only.</text>
</g>

<!-- failure trail -->
<g transform="translate(905,315)">
  <path d="M0 0 C90 55 130 40 210 98 C270 143 338 116 455 164" fill="none" stroke="#e4d1a8" stroke-width="16" stroke-linecap="round" opacity=".8"/>
  <path d="M0 0 C90 55 130 40 210 98 C270 143 338 116 455 164" fill="none" stroke="#ffffff" stroke-width="3" stroke-dasharray="13 16" opacity=".72"/>
  <text x="80" y="63" font-family="monospace" font-size="18" fill="#ffe9c2" transform="rotate(17 80 63)">libatomic.so.1 missing</text>
  <text x="280" y="130" font-family="monospace" font-size="18" fill="#baf1d3" transform="rotate(13 280 130)">repair → retry → publish</text>
</g>

