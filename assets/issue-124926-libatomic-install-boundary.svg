<g font-family="Arial,sans-serif" font-weight="700" fill="#20262a">
  <circle cx="72" cy="395" r="32" fill="#b53034"/><text x="72" y="406" text-anchor="middle" font-size="30" fill="#fff">1</text>
  <text x="116" y="404" font-size="30">BEFORE</text>
  <circle cx="464" cy="395" r="32" fill="#ac5c26"/><text x="464" y="406" text-anchor="middle" font-size="30" fill="#fff">2</text>
  <text x="508" y="404" font-size="30">ROOT CAUSE</text>
  <circle cx="856" cy="395" r="32" fill="#23805f"/><text x="856" y="406" text-anchor="middle" font-size="30" fill="#fff">3</text>
