<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
<defs>
  <linearGradient id="night" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#07111f"/><stop offset=".58" stop-color="#11243a"/><stop offset="1" stop-color="#09131d"/>
  </linearGradient>
  <radialGradient id="moon"><stop offset="0" stop-color="#fff3c9"/><stop offset=".72" stop-color="#e9c98d"/><stop offset="1" stop-color="#b68a52"/></radialGradient>
  <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#f5ead0"/><stop offset="1" stop-color="#d8c59d"/>
  </linearGradient>
  <linearGradient id="gate" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#b73234"/><stop offset="1" stop-color="#541418"/>
  </linearGradient>
  <linearGradient id="good" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#b8e6c8"/><stop offset="1" stop-color="#2a8d6b"/>
  </linearGradient>
  <filter id="glow"><feGaussianBlur stdDeviation="9"/></filter>
  <filter id="shadow"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000" flood-opacity=".45"/></filter>
  <pattern id="waves" width="56" height="28" patternUnits="userSpaceOnUse">
    <path d="M0 18 Q14 3 28 18 T56 18" fill="none" stroke="#d8c59d" stroke-opacity=".18" stroke-width="2"/>
  </pattern>
</defs>

<rect width="1600" height="900" fill="url(#night)"/>
<rect width="1600" height="900" fill="url(#waves)"/>

