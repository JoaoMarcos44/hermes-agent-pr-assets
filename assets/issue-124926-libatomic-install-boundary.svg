      <text x="44" y="289" fill="#ff8a93" font-family="ui-monospace,monospace" font-size="15">Update preparation failed</text>
    </g>
    <g transform="translate(375,0)">
      <rect width="350" height="320" rx="24" fill="#f2e6cc" stroke="#d9c7a5" stroke-width="3"/>
      <circle cx="38" cy="38" r="26" fill="#b8642a"/><text x="31" y="47" fill="#fff" font-size="25" font-weight="700">2</text>
      <text x="78" y="48" fill="#121820" font-family="Arial Black,Arial" font-size="28">ROOT CAUSE</text>
      <text x="28" y="92" fill="#80501f" font-family="Arial Black,Arial" font-size="17">DEPENDENCY MOVED, OWNER DID NOT</text>
      <g fill="#19232f" font-size="14.5">
        <text x="32" y="132">• Node 25+ needs libatomic.so.1</text>
        <text x="32" y="169">• old shell installer covered apt/libatomic1</text>
        <text x="32" y="206">• PM now owns Node staging during update</text>
        <text x="32" y="243">• host prerequisite was missing in that path</text>
      </g>
      <rect x="28" y="266" width="294" height="34" rx="8" fill="#1a2430"/>
      <text x="44" y="289" fill="#f6d28f" font-family="ui-monospace,monospace" font-size="15">verify stays read-only</text>
    </g>
    <g transform="translate(750,0)">
      <rect width="350" height="320" rx="24" fill="#f2e6cc" stroke="#d9c7a5" stroke-width="3"/>
      <circle cx="38" cy="38" r="26" fill="#256d6a"/><text x="31" y="47" fill="#fff" font-size="25" font-weight="700">3</text>
      <text x="78" y="48" fill="#121820" font-family="Arial Black,Arial" font-size="28">FIX</text>
      <text x="28" y="92" fill="#1f6f62" font-family="Arial Black,Arial" font-size="17">REPAIR ONLY AT STAGED INSTALL</text>
      <g fill="#19232f" font-size="14.5">
        <text x="32" y="132">• exact loader failure triggers repair hook</text>
        <text x="32" y="169">• Alma/RHEL: dnf install libatomic</text>
        <text x="32" y="206">• Debian/Ubuntu: apt install libatomic1</text>
        <text x="32" y="243">• then re-run Node smoke probe once</text>
      </g>
      <rect x="28" y="266" width="294" height="34" rx="8" fill="#10251f"/>
      <text x="44" y="289" fill="#77e5b5" font-family="ui-monospace,monospace" font-size="15">doctor stays read-only</text>
    </g>
    <g transform="translate(1125,0)">
      <rect width="350" height="320" rx="24" fill="#f2e6cc" stroke="#d9c7a5" stroke-width="3"/>
      <circle cx="38" cy="38" r="26" fill="#2f7b4a"/><text x="31" y="47" fill="#fff" font-size="25" font-weight="700">4</text>
      <text x="78" y="48" fill="#121820" font-family="Arial Black,Arial" font-size="28">RESULT</text>
      <text x="28" y="92" fill="#2d6b3e" font-family="Arial Black,Arial" font-size="17">UPDATE RECOVERS SAFELY</text>
