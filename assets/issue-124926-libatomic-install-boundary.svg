      <circle cx="95" cy="102" r="78" fill="#132234" stroke="#e7b15c" stroke-width="4"/>
      <circle cx="95" cy="102" r="44" fill="#0c141f" stroke="#e7b15c" stroke-width="3"/>
      <path d="M95 25 V179 M18 102 H172 M42 49 L148 155 M148 49 L42 155" stroke="#e7b15c" stroke-width="9"/>
      <rect x="192" y="16" width="390" height="168" rx="22" fill="#0c1622" stroke="#3e526c" stroke-width="2"/>
      <text x="220" y="53" fill="#f3e6ca" font-family="Arial Black,Arial" font-size="26">MOVE THE MUTATION</text>
      <text x="220" y="86" fill="#91a5bd" font-family="Arial,sans-serif" font-size="18">verify() stays diagnostic</text>
      <text x="220" y="115" fill="#91a5bd" font-family="Arial,sans-serif" font-size="18">staged install owns repair</text>
      <text x="220" y="144" fill="#52dda9" font-family="ui-monospace,monospace" font-size="18">dnf / apt / yum / ...</text>
      <text x="220" y="169" fill="#52dda9" font-family="ui-monospace,monospace" font-size="18">re-probe Node</text>
    </g>
  </g>
  <g transform="translate(70,505)" font-family="Arial,sans-serif">
    <g>
      <rect width="350" height="320" rx="24" fill="#f2e6cc" stroke="#d9c7a5" stroke-width="3"/>
      <circle cx="38" cy="38" r="26" fill="#a92f3d"/><text x="31" y="47" fill="#fff" font-size="25" font-weight="700">1</text>
      <text x="78" y="48" fill="#121820" font-family="Arial Black,Arial" font-size="28">BEFORE</text>
      <text x="28" y="92" fill="#82323b" font-family="Arial Black,Arial" font-size="17">UPDATE STOPS AFTER GIT PULL</text>
      <g fill="#19232f" font-size="14.5">
        <text x="32" y="132">• PM stages official nodejs.org Node</text>
        <text x="32" y="169">• node --version hits the dynamic loader</text>
        <text x="32" y="206">• libatomic.so.1 is absent on AlmaLinux</text>
        <text x="32" y="243">• staged Node is rejected and discarded</text>
      </g>
