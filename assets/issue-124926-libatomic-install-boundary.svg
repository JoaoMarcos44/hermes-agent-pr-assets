  <text x="72" y="742" fill="#dbe5ed">node --version</text><text x="72" y="770" fill="#f07c79">→ exit 127</text><text x="72" y="798" fill="#f2d0a1">libatomic.so.1 ⇒ not found</text>
  <rect x="446" y="710" width="322" height="105" rx="14" fill="#0b1520" stroke="#24394d" stroke-width="2"/>
  <text x="464" y="742" fill="#76dfb1">verify() = diagnosis</text><text x="464" y="770" fill="#dbe5ed">not privilege escalation</text><text x="464" y="798" fill="#f2d0a1">owner = staged install</text>
  <rect x="838" y="710" width="322" height="105" rx="14" fill="#0b1520" stroke="#24394d" stroke-width="2"/>
  <text x="856" y="742" fill="#76dfb1">sudo -n dnf install -y libatomic</text><text x="856" y="770" fill="#76dfb1">apt-get install -y libatomic1</text><text x="856" y="798" fill="#dbe5ed">retry node --version</text>
  <rect x="1230" y="710" width="316" height="105" rx="14" fill="#0b1520" stroke="#24394d" stroke-width="2"/>
  <text x="1248" y="742" fill="#76dfb1">staged probe: GREEN</text><text x="1248" y="770" fill="#dbe5ed">publish: allowed</text><text x="1248" y="798" fill="#dbe5ed">doctor: no sudo</text>
</g>

