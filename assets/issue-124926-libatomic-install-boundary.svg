  <circle cx="1248" cy="395" r="32" fill="#23805f"/><text x="1248" y="406" text-anchor="middle" font-size="30" fill="#fff">4</text>
  <text x="1292" y="404" font-size="30">RESULT</text>
</g>

<!-- bullets -->
<g font-family="Arial,sans-serif" font-size="20" fill="#34312c">
  <g transform="translate(54,447)">
    <circle cx="10" cy="8" r="11" fill="#b53034"/><text x="10" y="15" text-anchor="middle" fill="#fff" font-weight="700">×</text>
    <text x="37" y="13">PM stages official Node 26.</text>
    <circle cx="10" cy="65" r="11" fill="#b53034"/><text x="10" y="72" text-anchor="middle" fill="#fff" font-weight="700">×</text>
    <text x="37" y="62">node --version runs as smoke probe.</text>
    <circle cx="10" cy="122" r="11" fill="#b53034"/><text x="10" y="129" text-anchor="middle" fill="#fff" font-weight="700">×</text>
    <text x="37" y="119">Loader cannot find libatomic.so.1.</text>
    <circle cx="10" cy="179" r="11" fill="#b53034"/><text x="10" y="186" text-anchor="middle" fill="#fff" font-weight="700">×</text>
    <text x="37" y="176">Exit 127 rejects the staged tree.</text>
  </g>

  <g transform="translate(446,447)">
    <circle cx="10" cy="8" r="11" fill="#ac5c26"/><text x="10" y="14" text-anchor="middle" fill="#fff" font-weight="700">!</text>
    <text x="37" y="13">Node now comes from PM.</text>
    <circle cx="10" cy="65" r="11" fill="#ac5c26"/><text x="10" y="71" text-anchor="middle" fill="#fff" font-weight="700">!</text>
    <text x="37" y="62">libatomic is a host runtime library.</text>
    <circle cx="10" cy="122" r="11" fill="#ac5c26"/><text x="10" y="128" text-anchor="middle" fill="#fff" font-weight="700">!</text>
    <text x="37" y="116">verify() also powers doctor/read</text><text x="37" y="141">and build/cache checks.</text>
    <circle cx="10" cy="192" r="11" fill="#ac5c26"/><text x="10" y="198" text-anchor="middle" fill="#fff" font-weight="700">!</text>
    <text x="37" y="187">sudo inside verify() would mutate</text><text x="37" y="212">read-only diagnostic paths.</text>
  </g>

  <g transform="translate(838,447)">
    <circle cx="10" cy="8" r="11" fill="#23805f"/><text x="10" y="15" text-anchor="middle" fill="#fff" font-weight="700">✓</text>
    <text x="37" y="13">Staged verify sees exact loader error.</text>
    <circle cx="10" cy="65" r="11" fill="#23805f"/><text x="10" y="72" text-anchor="middle" fill="#fff" font-weight="700">✓</text>
    <text x="37" y="60">repair_staged_verification()</text><text x="37" y="85">owns host remediation.</text>
    <circle cx="10" cy="135" r="11" fill="#23805f"/><text x="10" y="142" text-anchor="middle" fill="#fff" font-weight="700">✓</text>
    <text x="37" y="130">Alma/RHEL → libatomic</text><text x="37" y="155">Debian/Ubuntu → libatomic1</text>
    <circle cx="10" cy="205" r="11" fill="#23805f"/><text x="10" y="212" text-anchor="middle" fill="#fff" font-weight="700">✓</text>
    <text x="37" y="200">Fail-fast sudo in noninteractive</text><text x="37" y="225">workers; retry Node once.</text>
  </g>

  <g transform="translate(1230,447)">
    <circle cx="10" cy="8" r="11" fill="#23805f"/><text x="10" y="15" text-anchor="middle" fill="#fff" font-weight="700">✓</text>
    <text x="37" y="13">Publish only after a green probe.</text>
    <circle cx="10" cy="65" r="11" fill="#23805f"/><text x="10" y="72" text-anchor="middle" fill="#fff" font-weight="700">✓</text>
    <text x="37" y="60">pm doctor remains diagnostic</text><text x="37" y="85">and read-only.</text>
    <circle cx="10" cy="135" r="11" fill="#23805f"/><text x="10" y="142" text-anchor="middle" fill="#fff" font-weight="700">✓</text>
    <text x="37" y="130">Cross-target staging never</text><text x="37" y="155">mutates the host.</text>
    <circle cx="10" cy="205" r="11" fill="#23805f"/><text x="10" y="212" text-anchor="middle" fill="#fff" font-weight="700">✓</text>
    <text x="37" y="200">Failed repair names the exact</text><text x="37" y="225">manual package command.</text>
  </g>
</g>

