      <path d="M350 106 l55 26 -55 26 z" fill="#d44e4e"/>
      <g transform="translate(410,30)">
        <rect x="0" y="0" width="250" height="120" rx="18" fill="#230d13" stroke="#ef5b66" stroke-width="3"/>
        <text x="24" y="38" fill="#ff8190" font-family="Arial Black,Arial" font-size="23">LOADER EXIT 127</text>
        <text x="24" y="72" fill="#f5d6d8" font-family="ui-monospace,monospace" font-size="19">libatomic.so.1</text>
